name: DataTrust Security Scan
on: [push, pull_request]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install DataTrust
        run: pip install datatrust-privacy-guard
      - name: Run Scan
        run: datatrust -d . --gh-actions
