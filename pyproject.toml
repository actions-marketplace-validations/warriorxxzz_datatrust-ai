[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "datatrust-privacy-guard"
version = "0.4.2"
description = "A local PII and Secret scanner for AI chats, files, and directories."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "warriorxxzz", email = "warriorxxzz8@gmail.com"}
]
dependencies = [
    "rich>=13.0.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.urls]
"Homepage" = "https://github.com/warriorxxzz/datatrust-ai"
"Bug Tracker" = "https://github.com/warriorxxzz/datatrust-ai/issues"

[project.scripts]
datatrust = "datatrust_ai.cli:main"

[tool.flit.module]
name = "datatrust_ai"
