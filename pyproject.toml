[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datatrust-ai"
version = "0.1.0"
description = "A local PII scanner for AI chat interfaces."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
datatrust = "guard.cli:main"

[tool.setuptools.packages.find]
include = ["guard*"]
