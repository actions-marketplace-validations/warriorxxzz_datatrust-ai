[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "datatrust-privacy-guard"
version = "2.4.0"
description = "An Enterprise-grade DevSecOps CLI for detecting and auto-remediating Secrets, PII, SAST, and IaC vulnerabilities. Built in Python."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "warriorxxzz", email = "warriorxxzz8@gmail.com"}
]
dependencies = [
    "rich>=13.0.0",
    "requests>=2.28.0",
    "pyyaml>=6.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.urls]
"Homepage" = "https://github.com/warriorxxzz/datatrust-ai"
"Bug Tracker" = "https://github.com/warriorxxzz/datatrust-ai/issues"

[project.scripts]
datatrust = "datatrust_ai.cli:main"
dt = "datatrust_ai.cli:main"

[tool.flit.module]
name = "datatrust_ai"
